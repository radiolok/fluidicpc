<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ah_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.6"/></marker><marker id="ah_ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#D85A30" stroke-width="1.6"/></marker><marker id="ah_clk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7F77DD" stroke-width="1.6"/></marker><marker id="ah_air" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#378ADD" stroke-width="1.6"/></marker><marker id="ah_exh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker></defs><rect width="1100" height="470" fill="#FFFFFF"/><text x="30" y="34" font-size="20" font-weight="600" fill="#2C2C2A">Нейрон «не более одного несовпадения»: цепочка на 2И и 2ИЛИ</text><text x="30" y="64" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">Рельс A — «пока всё совпало»: Aₙ = Aₙ₋₁ ∧ xₙ.   Рельс B — «ошибок не больше одной»: Bₙ = (Bₙ₋₁ ∧ xₙ) ∨ Aₙ₋₁.   Элементов: 3k − 5.</text><text x="30" y="84" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="400">xᵢ — прямой или инверсный выход ключа трубочки, в зависимости от веса +1 / −1.</text><text x="30" y="130" font-size="13" fill="#0F6E56" text-anchor="start" font-weight="600">рельс A</text><text x="30" y="405" font-size="13" fill="#993C1D" text-anchor="start" font-weight="600">рельс B</text><path d="M30,160 L148,160" fill="none" stroke="#444441" stroke-widt