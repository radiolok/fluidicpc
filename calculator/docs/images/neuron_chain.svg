ize="15" fill="#4A1B0C" text-anchor="start" font-weight="600">И</text><text x="430" y="338" font-size="12" fill="#993C1D" text-anchor="start" font-weight="400">B₂·x₃</text><path d="M480,100 L480,138" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><text x="486" y="118" font-size="12" fill="#444441" text-anchor="start" font-weight="400">x₃</text><path d="M480,405 L480,362" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><text x="486" y="400" font-size="12" fill="#444441" text-anchor="start" font-weight="400">x₃</text><path d="M320,170 L320,250 L620,250 L620,298" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><text x="326" y="244" font-size="12" fill="#444441" text-anchor="start" font-weight="400">A₂</text><path d="M540,330 L558,330" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><rect x="560" y="300" width="120" height="60" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/><text x="570" y="320" font-size="15" fill="#4A1B0C" text-anchor="start" font-weight="600">ИЛИ</text><text x="570" y="338" font-size="12" fill="#993C1D" text-anchor="start" font-weight="400">B₃</text><path d="M680,330 L698,330" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><rect x="700" y="300" width="120" height="60" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/><text x="710" y="320" font-size="15" fill="#4A1B0C" text-anchor="start" font-weight="600">И</text><text x="710" y="338" font-size="12" fill="#993C1D" text-anchor="start" font-weight="400">B₃·x₄</text><path d="M760,405 L760,362" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><text x="766" y="400" font-size="12" fill="#444441" text-anchor="start" font-weight="400">x₄</text><path d="M540,170 L900,170 L900,298" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><text x="846" y="164" font-size="12" fill="#444441" text-anchor="start" font-weight="400">A₃</text><path d="M820,330 L838,330" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><rect x="840" y="300" width="120" height="60" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5"/><text x="850" y="320" font-size="15" fill="#4A1B0C" text-anchor="start" font-weight="600">ИЛИ</text><text x="850" y="338" font-size="12" fill="#993C1D" text-anchor="start" font-weight="400">Y = B₄</text><path d="M960,330 L1060,330" fill="none" stroke="#444441" stroke-width="1.6"  marker-end="url(#ah_data)"/><text x="975" y="322" font-size="12" fill="#444441" text-anchor="start" font-weight="400">нейрон</text><text x="30" y="450" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Последний элемент рельса A (A₄) не нужен. Нейрон на k пикселей: 2 + 3·(k − 2) − 1 = 3k − 5 элементов; k = 5…8 → 10…19.</text></svg>