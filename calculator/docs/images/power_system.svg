<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="760" viewBox="0 0 1650 760" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ah_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#444441" stroke-width="1.6"/></marker><marker id="ah_ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#D85A30" stroke-width="1.6"/></marker><marker id="ah_clk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7F77DD" stroke-width="1.6"/></marker><marker id="ah_air" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#378ADD" stroke-width="1.6"/></marker><marker id="ah_exh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker></defs><rect width="1650" height="760" fill="#FFFFFF"/><text x="30" y="34" font-size="20" font-weight="600" fill="#2C2C2A">Система пневмопитания</text><rect x="30" y="90" width="170" height="90" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="40" y="110" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="600">Воздух зала</text><text x="40" y="128" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">всасывание через</text><text x="40" y="144" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">решётку основания</text><rect x="235" y="90" width="190" height="90" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="245" y="110" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Фильтр</text><text x="245" y="128" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">5–10 мкм, общий</text><text x="245" y="144" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">короб под основанием</text><rect x="460" y="90" width="270" height="90" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="470" y="110" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Турбовентиляторы ×4</text><text x="470" y="128" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">радиальные, не осевые</text><text x="470" y="144" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">в сумме 40–50 м³/ч при ≥ 1,5 кПа</text><text x="470" y="160" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">обратный клапан на каждом</text><rect x="765" y="90" width="230" height="90" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="775" y="110" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Охладитель (по месту)</text><text x="775" y="128" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">если воздух греется</text><text x="775" y="144" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">больше чем на 5 °C</text><rect x="1030" y="90" width="590" height="90" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="1040" y="110" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Буферная полость основания ≈ 5 л</text><text x="1040" y="128" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">вместо отдельного ресивера; перфорированная перегородка над выходами</text><text x="1040" y="144" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">вентиляторов гасит струи; опорная точка давления 1,00 кПа; v &lt; 0,5 м/с</text><path d="M200,135 L235,135" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><path d="M425,135 L460,135" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><path d="M730,135 L765,135" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><path d="M995,135 L1030,135" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><rect x="1350" y="235" width="270" height="120" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="1360" y="255" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="600">Гидрозатвор-маностат</text><text x="1360" y="273" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">трубка в воде на 102 мм</text><text x="1360" y="289" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">стравливает избыток 20–30 %</text><text x="1360" y="305" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">держит 1,00 кПа без электроники</text><text x="1360" y="321" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">альтернатива: датчик + ШИМ</text><path d="M1485,180 L1485,235" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><rect x="1050" y="235" width="265" height="120" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="1060" y="255" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="600">Контроль и подстройка</text><text x="1060" y="273" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">U-манометр на основании</text><text x="1060" y="289" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">штуцер на каждом блоке</text><text x="1060" y="305" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">игольчатый вентиль на блок —</text><text x="1060" y="321" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">выставить 1 раз при наладке</text><path d="M1350,295 L1315,295" fill="none" stroke="#378ADD" stroke-width="3.0"  /><rect x="1350" y="420" width="270" height="110" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="1360" y="440" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Боковые стояки блока</text><text x="1360" y="458" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">2 на блок, в полях 25 мм</text><text x="1360" y="474" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">открыты снизу в основание</text><text x="1360" y="490" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">окна в обе полости по высоте</text><text x="1360" y="506" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">потери 3–4 Па, A = B</text><path d="M1300,180 L1300,205 L1640,205 L1640,475 L1620,475" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><rect x="1070" y="420" width="245" height="110" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="1080" y="440" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Полости даёв</text><text x="1080" y="458" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">h = 5 мм, 150×150 мм</text><text x="1080" y="474" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">подача с двух боков</text><text x="1080" y="490" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">перепад ≈ 0,4 Па</text><text x="1080" y="506" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">≤ 78 л/мин на дай</text><rect x="800" y="420" width="235" height="110" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/><text x="810" y="440" font-size="14" fill="#042C53" text-anchor="start" font-weight="600">Отверстия питания</text><text x="810" y="458" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">Ø 2,5–3 мм в каждом</text><text x="810" y="474" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">элементе, прямо</text><text x="810" y="490" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">из полости</text><text x="810" y="506" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">потери 2–4 Па</text><rect x="530" y="420" width="235" height="110" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/><text x="540" y="440" font-size="14" fill="#04342C" text-anchor="start" font-weight="600">Сопло элемента</text><text x="540" y="458" font-size="12" fill="#0F6E56" text-anchor="start" font-weight="400">0,5×0,5 мм, ≈ 35 м/с</text><text x="540" y="474" font-size="12" fill="#0F6E56" text-anchor="start" font-weight="400">Re ≈ 1150</text><text x="540" y="490" font-size="12" fill="#0F6E56" text-anchor="start" font-weight="400">0,52 л/мин, не зависит</text><text x="540" y="506" font-size="12" fill="#0F6E56" text-anchor="start" font-weight="400">от логического состояния</text><rect x="260" y="420" width="235" height="110" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="270" y="440" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="600">Вент. втулки</text><text x="270" y="458" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Ø 3 мм сквозь полость</text><text x="270" y="474" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">и крышку — на обе</text><text x="270" y="490" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">стороны блока, 0,7–2 Па</text><rect x="30" y="420" width="195" height="110" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.5"/><text x="40" y="440" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="600">Зазоры 20 мм</text><text x="40" y="458" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">вверх и в торцы,</text><text x="40" y="474" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">&lt; 0,1 Па; кожух-</text><text x="40" y="490" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">глушитель по месту</text><path d="M1350,475 L1315,475" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><path d="M1070,475 L1035,475" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><path d="M800,475 L765,475" fill="none" stroke="#378ADD" stroke-width="3.0"  marker-end="url(#ah_air)"/><path d="M530,475 L495,475" fill="none" stroke="#888780" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ah_exh)"/><path d="M260,475 L225,475" fill="none" stroke="#888780" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ah_exh)"/><text x="30" y="588" font-size="14" fill="#2C2C2A" text-anchor="start" font-weight="600">Бюджет давления от полости основания до сопла (1,00 кПа, худший случай — дай заполнен полностью)</text><rect x="30" y="600" width="60" height="34" rx="0" fill="#85B7EB" stroke="#FFFFFF" stroke-width="1"/><rect x="90" y="600" width="30" height="34" rx="0" fill="#85B7EB" stroke="#FFFFFF" stroke-width="1"/><rect x="120" y="600" width="70" height="34" rx="0" fill="#378ADD" stroke="#FFFFFF" stroke-width="1"/><rect x="190" y="600" width="1430" height="34" rx="0" fill="#1D9E75" stroke="#FFFFFF" stroke-width="1"/><text x="36" y="656" font-size="12" fill="#185FA5" text-anchor="start" font-weight="400">стояки 3–4 Па · полость дая ≈ 0,4 Па · отверстие Ø 2,5 мм ≈ 4 Па (полоски не в масштабе)</text><text x="1600" y="622" font-size="13" fill="#FFFFFF" text-anchor="end" font-weight="600">на сопле остаётся ≈ 992 Па (99 %); разброс между элементами и даями &lt; 0,5 %</text><text x="30" y="690" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Расход: ≈ 960 элементов × 0,52 л/мин ≈ 500 л/мин (30 м³/ч); при заполнении всех 1200 мест — 625 л/мин. Полезная пневмомощность ≈ 10 Вт.</text><text x="30" y="710" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="400">Расход постоянный: струя только меняет выход, поэтому полости не видят «бросков тока» при переключениях.</text></svg>